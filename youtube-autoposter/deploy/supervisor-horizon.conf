; /etc/supervisor/conf.d/youtube-autoposter.conf
; Horizon runs all three queues: default, uploads, render (see config/horizon.php).
[program:youtube-autoposter-horizon]
process_name=%(program_name)s
command=php /var/www/youtube-autoposter/artisan horizon
directory=/var/www/youtube-autoposter
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/youtube-autoposter/storage/logs/horizon.log
; Let a running upload or render finish before a restart kills it.
stopwaitsecs=3700
