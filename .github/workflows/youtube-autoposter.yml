name: youtube-autoposter

on:
  push:
    paths: ['youtube-autoposter/**', '.github/workflows/youtube-autoposter.yml']
  pull_request:
    paths: ['youtube-autoposter/**', '.github/workflows/youtube-autoposter.yml']

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube-autoposter
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, intl, sqlite3, pdo_sqlite, redis
          coverage: none
      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
